<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CALCO · Dove Real Beauty Sketches</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=IBM+Plex+Mono&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--m:clamp(20px,5vw,72px);--g:clamp(12px,2vw,28px);--d:"Instrument Serif",Georgia,serif;--b:"Hanken Grotesk",system-ui,sans-serif;--mo:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 clamp(1rem,.4vw + .9rem,1.2rem)/1.55 var(--b);background:#EDEAE4;color:#26272A}
.s,.hd{--bg:#EDEAE4;--fg:#26272A;--mu:#5F6166;--pp:#DDD8CE;--cur:#DDE5EB;--red:#B53520;--blue:#3E6180;--ln:rgba(38,39,42,.4)}
.s.d,.hd.d{--bg:#121214;--fg:#EDEAE4;--mu:#A9ABAF;--pp:#232326;--cur:#1B242B;--red:#E2735C;--blue:#8FB1CF;--ln:rgba(237,234,228,.4)}
.s{min-height:100svh;padding:clamp(84px,12vh,130px) var(--m) clamp(48px,8vh,90px);display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:clamp(18px,3vw,36px);background:var(--bg);color:var(--fg);overflow-x:clip}
h1,h2{font:400 clamp(1.9rem,4.4vw,3.8rem)/1.02 var(--d);margin:0;max-width:20ch}
h1{font-size:clamp(2.25rem,6vw,6.5rem)}p{margin:0;max-width:62ch}
.k{font:400 .75rem/1.3 var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.lead{font:italic 400 clamp(1.15rem,2vw,1.6rem)/1.2 var(--d);color:var(--mu)}
.q{font:italic 400 clamp(1.1rem,2vw,1.5rem)/1.2 var(--d);margin:.5em 0 0}.red{color:var(--red)}.blue{color:var(--blue)}
.t{display:inline-block;font:.75rem/1.3 var(--mo);padding:0 .35em;border:1px solid currentColor;margin-right:.5em}.H{border-style:solid}.O{border-style:dashed}.I{border-style:dotted}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--g);align-items:center}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:var(--g)}
.g>*,.gr>*{min-width:0}
.col{display:grid;gap:14px;align-content:start}
@media(max-width:860px){.g>*{grid-column:1/-1}}
.f{position:relative;margin:0}.w{overflow:hidden;aspect-ratio:640/273;background:var(--pp)}
.w img{display:block;width:100%;height:auto;margin-top:-6.875%}
.f b{position:absolute;font:400 .75rem/1 var(--mo);color:var(--mu)}
.f b:nth-of-type(1){left:-11px;top:-9px}.f b:nth-of-type(2){right:-11px;top:-9px}.f b:nth-of-type(3){left:-11px;bottom:-9px}.f b:nth-of-type(4){right:-11px;bottom:-9px}
.r{opacity:0;transform:translateY(14px);transition:opacity .48s,transform .48s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*90ms)}
.in .r{opacity:1;transform:none}
.wp .w{clip-path:inset(0 100% 0 0);transition:clip-path .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*120ms)}
.wr .w{clip-path:inset(0 0 0 100%)}.in .wp .w{clip-path:inset(0)}
.bt{font:400 .8125rem var(--mo);letter-spacing:.06em;text-transform:uppercase;min-height:44px;min-width:44px;padding:0 14px;background:transparent;color:var(--fg);border:1px solid var(--fg);cursor:pointer}
.bt:hover,.bt[aria-pressed=true],.bt[aria-expanded=true]{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.hd{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 6px) var(--m) 6px;background:color-mix(in srgb,var(--bg) 90%,transparent);color:var(--fg);font:.75rem var(--mo);letter-spacing:.08em;text-transform:uppercase}
.hd #cl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .bt{border-color:var(--ln)}
#pg{position:absolute;left:0;bottom:0;height:2px;background:var(--red);width:0;transition:width .3s}
#mn{position:absolute;top:100%;right:var(--m);max-height:70svh;overflow:auto;background:var(--bg);border:1px solid var(--ln);padding:6px;display:grid;font-size:.8125rem}
#mn[hidden]{display:none}#mn button{all:unset;cursor:pointer;padding:10px 12px;min-height:24px;text-transform:none;letter-spacing:0;font-family:var(--b);font-size:.95rem}
#mn button:hover,#mn button:focus-visible{background:var(--pp)}
.sw{position:relative}.sh{position:absolute;inset:-10px;background:rgba(221,229,235,.88);border:1px dashed var(--ln);transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.in .sh:not(.off){transform:translateX(30%)}.sw~.col{position:relative;z-index:2}
.an{display:flex;align-items:center;gap:0}.an>.wp{flex:0 0 min(46%,420px)}.ln{height:1px;background:var(--red);width:0;flex:0 0 auto;transition:width 1s .5s}
.in .ln{width:clamp(24px,8vw,90px)}.an p{margin-left:14px}
@media(max-width:640px){.an{flex-direction:column;align-items:stretch;gap:12px}.an>.wp{flex:none}.ln{display:none}.an p{margin:0}}
.rl{display:flex;gap:4px;overflow-x:auto;padding:4px 0}.rl .bt{padding:0;flex:0 0 44px}
.cap{min-height:3.2em}.mo{font-family:var(--mo);font-size:.8125rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--g)*3*(1 - var(--k,0)) + 3px);transition:gap .3s}
.h{overflow:hidden;aspect-ratio:320/273;background:var(--pp);outline:1px solid var(--ln);outline-offset:4px}
.h img{display:block;width:200%;height:auto;margin-top:-13.75%}.h.b img{margin-left:-100%}
input[type=range]{width:100%;min-height:44px;accent-color:var(--blue)}
.sheet{padding:18px 20px;background:var(--cur);border-left:3px solid var(--blue)}.sheet.R{border-color:var(--red)}
.sheet ul{margin:8px 0 0;padding-left:1.1em}.sheet li{margin:.3em 0}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chips .bt{border-style:dashed;text-transform:none;letter-spacing:0;font-family:var(--d);font-size:1.3rem}
.mx{display:grid;gap:10px}.rw{display:grid;gap:6px;border-bottom:1px solid var(--ln);padding-bottom:10px}
.rw>button{all:unset;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;min-height:44px}
.rw .nm{flex:1 1 11em;font:400 clamp(1.2rem,2.2vw,1.7rem)/1.1 var(--d)}
.cl{display:inline-block;width:clamp(20px,4vw,34px);aspect-ratio:16/10;border:1px solid var(--fg);margin-right:4px;transition:background .4s;transition-delay:calc(var(--j)*110ms)}
.in .cl.on{background:var(--blue)}.in .rw.R .cl.on{background:var(--red)}.rw p{color:var(--mu)}
.big{font:400 clamp(3rem,9vw,7.5rem)/.95 var(--d)}
.card{display:grid;gap:10px;align-content:start}.card>button{all:unset;cursor:pointer;display:grid;gap:8px}
.card .tx{max-height:0;overflow:hidden;transition:max-height .5s}.card.open .tx{max-height:16em}
.cv[data-v=a] .R,.cv[data-v=r] .B{display:none}
.hint{color:var(--mu);font-size:.9rem}a{color:var(--blue)}
.note{border:1px dashed var(--ln);padding:14px;color:var(--mu)}
.f{margin-bottom:8px}.hd #cl{white-space:normal;line-height:1.2}@media(max-width:640px){.pair{grid-template-columns:1fr;max-width:420px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.r{opacity:1;transform:none}.wp .w{clip-path:none}.sh{transform:translateX(30%)}.ln{width:60px}}
</style></head><body>

["La pregunta",0,`<div class="g"><div class="c7 sw">${im(2,'wp')}<div class="sh" aria-hidden="true"></div></div><div class="c5 col"><p class="k r">01 · La pregunta</p><h1 class="r" style="--i:1">¿Cómo cambia lo que ves de ti cuando dejas de ser la única que te mira?</h1><p class="lead r" style="--i:2">Real Beauty Sketches · Dove, 2013. Análisis creativo y visual · Taller S12, Publicidad II.</p><div class="r" style="--i:3"><button class="bt" id="shb" aria-pressed="false">Mover el calco</button></div><p class="hint r" style="--i:4">Desplázate o usa ← →. Cada hoja de calco es una mirada. ${tg('H')}Hecho · ${tg('O')}Observación · ${tg('I')}Interpretación</p></div></div>`],
["Contexto y mecánica",0,`<p class="k r">02 · Contexto y mecánica</p><div class="g"><div class="c7"><div class="wp">${im(1)}</div><p class="cap" id="tlc" aria-live="polite"></p></div><div class="c5 col"><h2 class="r">Una pregunta práctica, dos descripciones, un contraste</h2><p class="r">${tg('H')}La campaña Real Beauty nació en 2004; Real Beauty Sketches se difundió en 2013. El artista forense Gil Zamora dibuja a cada participante primero según su propia descripción y luego según la de otra persona.</p><p class="r">${tg('I')}Preparar → Describirse → Cambiar de perspectiva → Comparar: una pequeña demostración narrativa.</p></div></div><div><p class="k">Regla temporal · 20 fotogramas · toca uno</p><div class="rl" id="rl">${T.map((t,i)=>`<button class="bt" data-n="${i+1}" aria-label="Escena ${i+1}, ${TM[i]}: ${t}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div></div>`],
["Autopercepción",0,`<p class="k r">03 · Autopercepción</p><h2 class="r">Las palabras hacen visible cómo nos vemos</h2><div class="gr">${[4,6,7].map((n,i)=>`<div>${wp(n,i)}<p class="q red r" style="--i:${i+1}">${Q[n]?'«'+Q[n]+'»':'«pero después de varias preguntas supe que me estaba dibujando.»'}</p><p class="k">${tg('O')}Escena ${n}</p></div>`).join('')}</div><div class="an"><div class="wp">${im(5)}</div><i class="ln"></i><p class="r">${tg('O')}Detalle del ojo. ${tg('I')}El primer plano convierte un rasgo cotidiano en foco de atención. <span class="q red">«${Q[5]}»</span></p></div>`],
["La segunda mirada",0,`<p class="k r">04 · La segunda mirada</p><h2 class="r">Alguien más describe a la misma persona</h2><div class="gr">${[9,10,11,12].map((n,i)=>`<div>${wp(n,i,'wp wr')}<p class="q blue r" style="--i:${i+1}">${Q[n]?'«'+Q[n]+'»':'«Te voy a hacer algunas preguntas sobre la persona que has conocido antes»'}</p><p class="k">${tg('O')}Escena ${n}</p></div>`).join('')}</div><p class="r">${tg('I')}La descripción externa enfatiza otros rasgos y cualidades sin cambiar el procedimiento del retrato.</p>`],
["Comparación",1,`<div class="g"><div class="c4 col"><p class="k r">05 · Comparación</p><h2 class="r">Dos descripciones. Dos retratos.</h2><p class="lead r">Acércalos. La diferencia está en la mirada que describe.</p><label class="k" for="rg">Acercar los retratos</label><input id="rg" type="range" min="0" max="100" value="0"><p class="hint">${tg('I')}Los retratos no miden qué rostro es más bello: dependen de las palabras que se dicen y del criterio del artista.</p></div><div class="c8"><div class="pair" id="pr"><div class="h"><img data-i="15" alt="Retrato dibujado de la izquierda, escena 15"></div><div class="h b"><img data-i="15" alt="Retrato dibujado de la derecha, escena 15"></div></div><p class="k" style="margin-top:14px">Retrato izquierdo · Retrato derecho · Escena 15 · 01:50</p></div></div><div class="gr">${[14,13,16].map((n,i)=>`<div>${wp(n,i)}<p class="q r" style="--i:${i+1}">«${Q[n]}»</p><p class="k">${tg('O')}Escena ${n} · ${TM[n-1]}</p></div>`).join('')}</div>`],
["Originalidad y flexibilidad",0,`<p class="k r">06 · Psicología de la creatividad</p><div class="g"><div class="c6 col"><h2 class="r">Originalidad <span class="blue">alta</span></h2><div class="wp">${im(8)}</div><p class="r">${tg('I')}El retrato forense no es un invento de la publicidad: la novedad está en llevarlo a un problema emocional y convertirlo en metáfora de la autopercepción. Sustituye el antes/después físico por dos interpretaciones de la misma persona.</p></div><div class="c6 col"><h2 class="r">Flexibilidad <span class="blue">alta</span></h2><div class="wp wr">${im(13)}</div><p class="r">${tg('I')}Cambia el encuadre habitual: en vez de qué producto mejora la apariencia, muestra cómo se construye la imagen de una misma. Combina testimonio, experimento, retrato y reacción.</p></div></div><div class="sheet R r"><p class="k">Límite que conviene reconocer</p><p>La campaña replantea quién evalúa la apariencia, pero sigue usando la belleza percibida como resultado deseable.</p></div>`],
["Fluidez y resolución",0,`<p class="k r">07 · Psicología de la creatividad</p><div class="g"><div class="c6 col"><h2 class="r">Fluidez cognitiva: ocho asociaciones posibles</h2><p class="r">${tg('I')}Activa asociaciones, no todas las audiencias la leen igual. Toca para encenderlas.</p><div class="chips r" id="ch">${['autocrítica','autoestima','presión social','comparación','edad','rasgos físicos','lenguaje','confianza'].map(w=>`<button class="bt" aria-pressed="false">${w}</button>`).join('')}</div><p class="k" id="cc" aria-live="polite">0 / 8 activadas</p></div><div class="c6">${wp(6)}<p class="k">${tg('O')}Escena 06 · La participante enumera rasgos de forma autocrítica.</p></div></div><div class="g"><div class="c6">${wp(17,0,'wp wr')}<p class="k">${tg('O')}Escena 17 · <span class="q blue">«${Q[17]}»</span></p></div><div class="c6 col"><h2 class="r">Resolución de problemas: <span class="blue">alta como comunicación</span></h2><p class="r">${tg('I')}Reto: mostrar que la autopercepción puede ser severa sin dar una lección moral. Solución: un experimento audiovisual. Es efectiva como comunicación, no una solución definitiva a los estándares de belleza.</p></div></div>`],
["Gráfica y audiovisual",0,`<p class="k r">08 · Gráfica, imágenes y video</p><h2 class="r">Una estética documental al servicio de la idea</h2><div class="g"><div class="c7"><div id="tbv">${im(2)}</div><div class="rl" id="tb" role="group" aria-label="Elegir plano"><button class="bt" style="flex:0 0 auto;padding:0 14px" data-n="2" aria-pressed="true">Espacio</button><button class="bt" style="flex:0 0 auto;padding:0 14px" data-n="5" aria-pressed="false">Detalle</button><button class="bt" style="flex:0 0 auto;padding:0 14px" data-n="16" aria-pressed="false">Dibujo</button></div><p class="cap" id="tbc" aria-live="polite"></p></div><div class="c5 col r"><p><b>Color</b> ${tg('O')}Tonos neutros, luz natural, grises y azules suaves; el color no compite con los rostros.</p><p><b>Tipografía y grafismo</b> ${tg('O')}Poco texto superpuesto; subtítulos para el diálogo; al cierre, fondo blanco y logotipo.</p><p><b>Composición</b> ${tg('O')}Planos medios para la interacción, primeros planos para la expresión, dibujos alineados para comparar.</p><p><b>Ritmo</b> ${tg('I')}Avanza lento en las descripciones y acelera el significado en la comparación final.</p></div></div>`],
["Elementos simbólicos",1,`<p class="k r">09 · Elementos simbólicos</p><h2 class="r">Cuatro elementos que construyen significado</h2><div class="gr">${[[2,'La cortina','Separa a la participante del dibujante: la imagen se construye sin observación directa.'],[13,'Los dos retratos','Convierten una diferencia subjetiva en un contraste que la audiencia puede comparar.'],[17,'La reacción','Punto de reconocimiento emocional: prueba narrativa de que el resultado importa a la participante.'],[20,'El logotipo final','La marca firma la reflexión y la vincula con su posicionamiento sobre belleza y autoestima.']].map(([n,t,x],i)=>`<div class="card r" style="--i:${i}">${im(n)}<button aria-expanded="false"><span class="k">${String(n).padStart(2,'0')} · ${t} · toca para leer</span></button><div class="tx"><p>${tg('I')}${x}</p></div></div>`).join('')}</div><p class="r">${tg('I')}El retrato no es una medida objetiva de belleza: es una representación condicionada por las palabras, el criterio del artista y el montaje.</p>`],
["Consistencia visual",0,`<p class="k r">10 · Consistencia visual</p><div class="g"><div class="c6 col"><h2 class="r">Coherente dentro de la pieza. Sin evidencia entre piezas.</h2><p class="r">${tg('O')}Dentro del comercial: luz natural, grises y azules suaves, poco texto y cierre en blanco con logotipo, de principio a fin.</p><div class="note r">${tg('I')}Entre anuncios impresos, TV y online: no está documentado en este análisis. Hace falta revisar esos soportes antes de afirmar consistencia de campaña.</div></div><div class="c6 gr">${wp(18)}${wp(19,1,'wp wr')}</div></div>`],
["Evaluación creativa",1,`<p class="k r">11 · Evaluación creativa</p><h2 class="r">La campaña, criterio por criterio</h2><p class="lead r">Valoración cualitativa de este análisis (1 bajo · 3 medio · 5 alto). No es una medición de audiencia. Toca una fila.</p><div class="mx">${[['Originalidad',4,'Aplicación distintiva del retrato forense a la autopercepción; novedoso en este contexto, aunque no es una técnica nueva.'],['Relevancia',5,'Conecta con las presiones sociales sobre la apariencia y con la categoría de cuidado personal.'],['Impacto emocional',5,'La espera, el contraste y las reacciones están diseñados para provocar identificación y conversación.'],['Claridad del mensaje',5,'La comparación de los dibujos sintetiza la idea sin depender de una explicación complicada.'],['Coherencia con Dove',4,'Se alinea con el territorio de belleza real de la marca; el vínculo con el producto es indirecto.'],['Solidez como prueba social',2,'Ilustra una tesis, pero su montaje no demuestra que el efecto sea universal ni que persista en el tiempo.']].map(([n,v,x],i)=>`<div class="rw r${v<3?' R':''}" style="--i:${i}"><button aria-expanded="false"><span class="nm">${n}</span><span>${cell(v)}</span><span class="mo">${v}/5 ${tg('I')}</span></button><p hidden>${x}</p></div>`).join('')}</div><p class="r">Resultado global: fuerte como storytelling emocional y generadora de atención; menos concluyente como evidencia científica o demostración del producto.</p>`],
["Efectividad",0,`<p class="k r">12 · Efectividad publicitaria</p><h2 class="r">Atención no es lo mismo que transformación</h2><div class="g"><div class="c4 col r"><div class="big">50M+</div><p>visualizaciones en los primeros 12 días, según la página de Dove [2]. ${tg('H')}Dato comunicado por la propia marca.</p></div><div class="c4 col r" style="--i:1"><div class="big">163M+</div><p>visualizaciones globales reportadas en el caso de Think with Google [4]. ${tg('H')}Cifra histórica de 2013, no actual.</p></div><div class="c4 col r" style="--i:2"><p class="k">¿Qué medir más allá de las vistas?</p><p><b>Atención</b> reproducciones completas y abandono · <b>Conversación</b> compartidos y menciones · <b>Marca</b> recuerdo y asociación · <b>Efecto social</b> encuestas antes/después con seguimiento · <b>Negocio</b> búsquedas, tráfico y conversiones</p></div></div><div class="sheet R r">${tg('I')}Las cifras prueban distribución extraordinaria; no demuestran por sí solas mejor autoestima, cambio de estándares ni más ventas.</div>`],
["Lectura crítica",1,`<p class="k r">13 · Lectura crítica</p><h2 class="r">El acierto y la contradicción</h2><div class="g"><div class="c6 sheet r"><p class="k blue">Lo que hace bien</p><ul><li>Representa experiencias y rasgos cotidianos en lugar de una transformación estética.</li><li>Convierte una idea social en un relato visual fácil de compartir.</li><li>Construye coherencia con el posicionamiento de Dove.</li><li>Invita a pensar en la autocrítica y en los ideales aprendidos.</li></ul></div><div class="c6 sheet R r" style="--i:1"><p class="k red">Lo que debemos cuestionar</p><ul><li>La muestra no permite generalizar a todas las mujeres.</li><li>El lenguaje, el criterio del artista y la edición influyen en los retratos.</li><li>La mirada externa se presenta como corrección de la propia.</li><li>La marca usa una causa social para diferenciarse en el mercado.</li></ul></div></div><p class="r">${tg('H')}Millard (2009) analiza la belleza como actuación pública [5]; Murray (2013) examina la relación entre discurso de cambio social y estrategia de marca [6]. Obligan a distinguir intención, interpretación y efecto.</p>`],
["Conclusión",1,`<div class="g cv" id="cv" data-v="ab"><div class="c6 col"><p class="k r">14 · Conclusión</p><h2 class="r">¿Me gustó la propuesta? Sí, con matices.</h2><div class="r" role="group" aria-label="Elegir hoja"><button class="bt" data-v="a" aria-pressed="false">Lo que logra</button> <button class="bt" data-v="r" aria-pressed="false">Lo que no prueba</button> <button class="bt" data-v="ab" aria-pressed="true">Ambas</button></div><div class="sheet B"><p class="k blue">Lo que logra</p><p>Hace visible una pregunta social y construye una pieza memorable: conecta emoción, concepto y narrativa.</p></div><div class="sheet R"><p class="k red">Lo que no puede probar</p><p>Una experiencia seleccionada y editada no equivale a una verdad general; sigue usando la belleza como centro del argumento.</p></div></div><div class="c6 col">${wp(18)}<p class="q">«Es publicidad con impacto cultural, no una prueba científica.»</p><p class="r">${tg('I')}La creatividad también implica elegir qué problema se hace visible, desde qué perspectiva se presenta y qué evidencia permite sostener la conclusión.</p></div></div>`],
["Referencias",0,`<p class="k r">15 · Referencias</p><h2 class="r">Fuentes utilizadas</h2><div class="col r" style="font-size:.95rem"><p>[1] UNIFRANZ. Creatividad en la publicidad: la fusión de efectividad y proceso creativo. Taller de Creatividad. <a href="https://cdn.unifranz.com/etec/online/ver_act/sem2/tcr-211/tcr-211_hito3/contenido/s12_co_Creatividad_en_la_Publicidad.pdf" rel="noopener">enlace</a></p><p>[2] DOVE. Real Beauty Sketches. <a href="https://www.dove.com/es/stories/campaigns/real-beauty-sketches.html" rel="noopener">enlace</a></p><p>[3] OGILVY. Real Beauty Sketches — Dove. <a href="https://www.ogilvy.com/work/real-beauty-sketches" rel="noopener">enlace</a></p><p>[4] THINK WITH GOOGLE. Authentic expression of Real Beauty catapults Dove to 163 million global views on YouTube. <a href="https://www.thinkwithgoogle.com/_qs/documents/405/dove-real-beauty-sketches_case-studies.pdf" rel="noopener">enlace</a></p><p>[5] MILLARD, J. (2009). Performing Beauty: Dove’s “Real Beauty” Campaign. Symbolic Interaction, 32(2), 146–168. <a href="https://doi.org/10.1525/si.2009.32.2.146" rel="noopener">DOI</a></p><p>[6] MURRAY, D. P. (2013). Branding “Real” Social Change in Dove’s Campaign for Real Beauty. Feminist Media Studies, 13(1), 83–101. <a href="https://doi.org/10.1080/14680777.2011.647963" rel="noopener">DOI</a></p></div><div class="note r">Nota metodológica: análisis visual sobre el video proporcionado; la evaluación es cualitativa y no reemplaza una investigación de audiencia ni una medición causal.</div>`]
];
